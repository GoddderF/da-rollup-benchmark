[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc6019-da-rollup-bench"
version = "0.1.0"
description = "Reproducible data-availability-aware rollup benchmarking simulator"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
da-rollup-bench = "da_rollup_bench.cli:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=tmp/pytest"
testpaths = ["tests"]
